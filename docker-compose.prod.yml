# Production — utilise le conteneur de base de données existant « db »
# du réseau Docker externe « mikrotikreseau » (aucune base n'est créée ici).
#
# Le site est servi par le Nginx du serveur (HTTPS, ports 80/443), qui
# transmet à http://127.0.0.1:7980 ; ce fichier ne prend jamais les ports 80/443.
#
#   cp .env.production.example .env      (puis compléter, DB_HOST=db)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec portfolio-app php artisan db:seed --force   (premier lancement)
#
# Les services portent le préfixe « portfolio- » : sur le réseau partagé
# mikrotikreseau, un nom générique comme « app » ou « web » entrerait en
# conflit avec les conteneurs des autres projets.

name: portfolio

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: portfolio-app:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - media:/var/www/html/storage/app/public
    - logs:/var/www/html/storage/logs
  networks:
    - portfolio
    - mikrotikreseau

services:
  portfolio-app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"

  portfolio-queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=75 --max-time=3600
    healthcheck:
      disable: true
    depends_on:
      portfolio-app:
        condition: service_healthy

  portfolio-scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true
    depends_on:
      portfolio-app:
        condition: service_healthy

  portfolio-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: portfolio-web:latest
    restart: unless-stopped
    # Derrière le Nginx du serveur (qui garde les ports 80 et 443, avec le HTTPS) :
    # Caddy n'est joignable que depuis le serveur, sur 127.0.0.1:7980 (HTTP_PORT).
    ports:
      - "127.0.0.1:${HTTP_PORT:-7980}:80"
    environment:
      SITE_ADDRESS: ":80"
      PHP_FPM_HOST: portfolio-app:9000
    volumes:
      - media:/var/www/html/storage/app/public:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - portfolio
    depends_on:
      - portfolio-app

networks:
  portfolio:
    name: portfolio
  mikrotikreseau:
    external: true

volumes:
  media:
  logs:
  caddy-data:
  caddy-config:
