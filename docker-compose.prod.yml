# Production — utilise le conteneur de base de données existant « db »
# du réseau Docker externe « mikrotikreseau » (aucune base n'est créée ici).
#
#   cp .env.production.example .env      (puis compléter, DB_HOST=db)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec portfolio-app php artisan db:seed --force   (premier lancement)
#
# Les services portent le préfixe « portfolio- » : sur le réseau partagé
# mikrotikreseau, un nom générique comme « app » ou « web » entrerait en
# conflit avec les conteneurs des autres projets.

name: portfolio

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: portfolio-app:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - media:/var/www/html/storage/app/public
    - logs:/var/www/html/storage/logs
  networks:
    - portfolio
    - mikrotikreseau

services:
  portfolio-app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"

  portfolio-queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=75 --max-time=3600
    healthcheck:
      disable: true
    depends_on:
      portfolio-app:
        condition: service_healthy

  portfolio-scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true
    depends_on:
      portfolio-app:
        condition: service_healthy

  portfolio-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: portfolio-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:7980"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Définir SITE_ADDRESS dans .env (nom de domaine, ou :80 derrière un proxy)}
      PHP_FPM_HOST: portfolio-app:9000
    volumes:
      - media:/var/www/html/storage/app/public:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - portfolio
    depends_on:
      - portfolio-app

networks:
  portfolio:
    name: portfolio
  mikrotikreseau:
    external: true

volumes:
  media:
  logs:
  caddy-data:
  caddy-config:
