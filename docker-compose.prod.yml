# Production.
#   cp .env.production.example .env   (puis compléter)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app php artisan db:seed --force   (premier lancement)

name: portfolio-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: portfolio-app:latest
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment:
    DB_HOST: db
    DB_PORT: 5432
  volumes:
    - media:/var/www/html/storage/app/public
    - logs:/var/www/html/storage/logs
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: "true"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=120 --max-time=3600
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: portfolio-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Définir SITE_ADDRESS (nom de domaine) dans .env}
      PHP_FPM_HOST: app:9000
    volumes:
      - media:/var/www/html/storage/app/public:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  media:
  logs:
  caddy-data:
  caddy-config:
