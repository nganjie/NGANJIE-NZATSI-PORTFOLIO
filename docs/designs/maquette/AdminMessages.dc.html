<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Messages — administration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FAFAF7}
a{color:#0E0E10}a:hover{color:#6A1BF0}
.side a.item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#D5D4DC;text-decoration:none;font-size:15px;font-weight:500}
.side a.item:hover{background:#2A2A30;color:#FFFFFF}
.side a.on{background:#A6F20A;color:#0E0E10;font-weight:600}
.side a.on:hover{background:#A6F20A;color:#0E0E10}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;font-family:'Schibsted Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
.boite{display:grid;grid-template-columns:380px minmax(0,1fr);gap:0;background:#FFFFFF;border:1px solid #DEDDD8;border-radius:16px;overflow:hidden;min-height:680px}
.ligne{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EFEEEA;padding:16px 20px;font:inherit;color:#0E0E10;cursor:pointer}
@media (max-width:1000px){.boite{grid-template-columns:1fr}}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px; font-family: 'Figtree', sans-serif; font-size: 16px; line-height: 1.55; color: #0E0E10; background: #FAFAF7">

<aside class="side" style="flex: 1 1 260px; max-width: 280px; background: #0E0E10; padding: 28px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; padding: 0 14px 28px">
<span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #6A1BF0; transform: rotate(-8deg)"></span>
<span style="font-family: 'Schibsted Grotesk', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em">nganjie<span style="color: #A6F20A">.</span></span>
</a>
<nav aria-label="Administration" style="display: flex; flex-direction: column; gap: 4px">
<a class="item" href="AdminTableau.dc.html">Tableau de bord</a>
<a class="item" href="#">Profil et CV</a>
<a class="item" href="AdminProjets.dc.html">Projets</a>
<a class="item" href="#">Compétences</a>
<a class="item" href="#">Technologies</a>
<a class="item" href="#">Parcours</a>
<a class="item" href="#">Méthode</a>
<a class="item on" href="AdminMessages.dc.html" aria-current="page">Messages <span style="margin-left: auto; background: #0E0E10; color: #FFFFFF; border-radius: 999px; padding: 0 9px; font-size: 13px">{{nonLus}}</span></a>
<a class="item" href="#">Médias</a>
<a class="item" href="#">Paramètres</a>
</nav>
<div style="margin-top: auto; padding: 20px 14px 0; border-top: 1px solid #2A2A30; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<a href="Main.dc.html" style="color: #D5D4DC">Voir le site ↗</a>
<a href="AdminConnexion.dc.html" style="color: #B9B8C2">Se déconnecter</a>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 40px 48px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px">
<div>
<p style="margin: 0 0 4px; color: #55545A">{{nonLus}} non lus</p>
<h1 style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.03em; text-transform: uppercase">Messages</h1>
</div>
<div role="tablist" aria-label="Dossier" style="display: inline-flex; gap: 4px; background: #EFEEEA; border-radius: 999px; padding: 4px">
<button type="button" role="tab" aria-selected="true" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: #0E0E10; color: #FFFFFF; font-weight: 600; cursor: pointer">Boîte de réception</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: transparent; color: #0E0E10; font-weight: 600; cursor: pointer">Archivés</button>
</div>
</div>

<div class="boite">
<ul style="list-style: none; margin: 0; padding: 0; border-right: 1px solid #DEDDD8">
<sc-for list="{{liste}}" as="m" hint-placeholder-count="4">
<li>
<button type="button" class="ligne" onClick="{{m.ouvrir}}" aria-current="{{m.courantTxt}}" style="background: {{m.fond}}; box-shadow: inset 4px 0 0 {{m.barre}}">
<span style="display: flex; justify-content: space-between; gap: 12px; align-items: center">
<span style="display: flex; align-items: center; gap: 8px; font-weight: {{m.poids}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{m.point}}"></span>{{m.nom}}</span>
<span style="font-size: 13px; color: #55545A">{{m.date}}</span>
</span>
<span style="display: block; margin-top: 6px"><span style="background: #EFEEEA; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600">{{m.type}}</span></span>
<span style="display: block; margin-top: 6px; font-size: 14px; color: #55545A">{{m.extrait}}</span>
</button>
</li>
</sc-for>
</ul>

<article style="padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
<div>
<span style="background: #DCCBFF; color: #2A1466; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600">{{sel.type}}</span>
<h2 style="margin: 12px 0 4px; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 26px">{{sel.nom}}</h2>
<p style="margin: 0; font-size: 15px; color: #55545A">{{sel.mail}} · {{sel.date}}</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" class="btn" onClick="{{marquerNonLu}}" style="background: #EFEEEA; color: #0E0E10">Marquer non lu</button>
<button type="button" class="btn" style="background: #EFEEEA; color: #0E0E10">Archiver</button>
<button type="button" class="btn" style="background: #FFFFFF; color: #A11B1B; border: 1px solid #A11B1B">Supprimer</button>
</div>
</div>
<div style="border-top: 1px solid #EFEEEA; padding-top: 20px; font-size: 16px; color: #2A2A30; white-space: pre-line">{{sel.corps}}</div>
<div style="margin-top: auto">
<a class="btn" href="#" style="background: #6A1BF0; color: #FFFFFF; min-height: 52px; padding: 0 28px">Répondre par e-mail ↗</a>
</div>
</article>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { courant: 0, lus: [false, false, false, true], force: false }; }
renderVals() {
const msgs = [
{ nom: '[Expéditeur 1]', mail: '[adresse e-mail]', date: "Aujourd'hui", type: "Offre d'emploi", extrait: '[Début du message…]', corps: "[Contenu du message reçu depuis le formulaire de contact.]\n\nLe type de demande, le nom et l'e-mail sont repris du formulaire." },
{ nom: '[Expéditeur 2]', mail: '[adresse e-mail]', date: 'Hier', type: 'Mission freelance', extrait: '[Début du message…]', corps: '[Contenu du message]' },
{ nom: '[Expéditeur 3]', mail: '[adresse e-mail]', date: '2 oct.', type: 'Autre demande', extrait: '[Début du message…]', corps: '[Contenu du message]' },
{ nom: '[Expéditeur 4]', mail: '[adresse e-mail]', date: '28 sept.', type: "Offre d'emploi", extrait: '[Début du message…]', corps: '[Contenu du message]' }
];
const { courant, lus, force } = this.state;
const lusAff = lus.map((l, i) => l || (i === courant && !force));
return {
nonLus: lusAff.filter(l => !l).length,
sel: msgs[courant],
marquerNonLu: () => { const n = lus.slice(); n[courant] = false; this.setState({ lus: n, force: true }); },
liste: msgs.map((m, i) => {
const actif = i === courant, lu = lusAff[i];
return { ...m, courantTxt: actif ? 'true' : 'false', fond: actif ? '#F4F0FF' : '#FFFFFF', barre: actif ? '#6A1BF0' : 'transparent',
poids: lu ? '500' : '700', point: lu ? 'transparent' : '#6A1BF0',
ouvrir: () => { const n = lus.slice(); n[i] = true; this.setState({ courant: i, lus: n, force: false }); } };
})
};
}
}
</script>
</body>
</html>
